spring:
  application:
    name: ecommerce

  config:
    # Load .env locally (optional - will be skipped on Render where env vars are set directly)
    import: optional:file:backend/.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${SHOW_SQL:false}

    
server:
  port: ${PORT:8080}

app:
  jwt:
    # Override JWT_SECRET on Render dashboard (min 32 chars)
    secret: ${JWT_SECRET:EcommerceSecretKeyForJWTAuthSuperSecureKey1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    # Override ALLOWED_ORIGINS on Render dashboard (comma-separated)
    # Example: http://localhost:5173,https://neostore.onrender.com
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}